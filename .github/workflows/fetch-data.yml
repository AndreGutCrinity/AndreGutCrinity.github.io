name: fetch-data

# Daily download of ZEC/USDT 1m candles from Binance's public data dump.
# This is the ONLY thing that touches Binance; the website makes no API calls.

on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill this many months (blank = incremental only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch candles
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            node scripts/fetch.mjs --backfill ${{ github.event.inputs.backfill }}
          else
            node scripts/fetch.mjs
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update ZECUSDT 1m candles ($(date -u +%Y-%m-%d))"
            git push
          fi
